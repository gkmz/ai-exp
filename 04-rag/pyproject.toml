[project]
name = "rag-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "numpy>=2.4.2",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
