[project]
name = "agent-course"
version = "0.1.0"
description = "Agent 开发学习实践"
readme = "README.md"
requires-python = ">=3.12"

# 第 1-4 章：手写，只依赖基础库
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 第 5-9 章：增加持久化
state = [
    "aiosqlite>=0.20.0",
]
# 第 10 章后：增加框架
frameworks = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
]
# 第 13 章：工程化
engineering = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
